name: Commit messages

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  conventional:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate pull request commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(✨|🐛|📚|✅|🧪|📦|➕|➖|⚡|♻️|🎨|🔧|🧱|🗃️|🧹|🗑️|🔒️|🎉) (feat|fix|docs|test|build|perf|style|refactor|chore|ci|raw|cleanup|remove|init)(\([a-z0-9._/-]+\))?!?: .+'
          failed=0
          while IFS= read -r message; do
            if ! printf '%s\n' "$message" | grep -Eq "$pattern"; then
              printf 'Invalid commit message: %s\n' "$message"
              failed=1
            fi
          done < <(git log --format=%s "$BASE_SHA..$HEAD_SHA")
          exit "$failed"

