site_name: Xtream PHP Client
site_description: A PHP 7.0+ client for Xtream-compatible IPTV Player APIs.
site_url: https://giovanipatrick.github.io/xtream-php-client/
repo_url: https://github.com/giovanipatrick/xtream-php-client
repo_name: giovanipatrick/xtream-php-client
copyright: Copyright &copy; 2026 Giovani Patrick

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - API reference: api-reference.md
  - Development: development.md
  - Português:
      - Início: pt-BR/index.md
      - Primeiros passos: pt-BR/getting-started.md

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

strict: true

